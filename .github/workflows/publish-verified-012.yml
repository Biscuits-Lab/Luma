name: Publish verified Luma 0.1.2
on:
  push:
    branches: [release/publish-v0.1.2]
    paths:
      - .github/workflows/publish-verified-012.yml
      - scripts/publish_verified_012.py
      - scripts/test_publish_verified_012.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luma-publish-verified-v0.1.2
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.repository == 'Biscuits-Lab/Luma' && !github.event.repository.private && github.ref == 'refs/heads/release/publish-v0.1.2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test bounded publication guards
        run: python -m unittest discover -s scripts -p test_publish_verified_012.py
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          repository: Biscuits-Lab/Luma
          run-id: 38865585679
          artifact-ids: 12031232250
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Publish exact tested bytes and verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_verified_012.py --artifacts artifacts
