name: Windows EXR, thumbnail and installer validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-exr-validation
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      LUMA_SHELL_TEST_REAL_REGISTRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          architecture: x64
      - name: Preflight native installer compilation without setup output
        shell: pwsh
        run: python scripts/preflight_installer.py
      - name: Build native bridge, test viewer, create folder bundle
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify installer and release-safety contracts
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe -m pytest scripts/test_installer_contract.py scripts/test_release_gate.py -q
      - name: Verify localized controls and relative zoom at 200 percent scaling
        id: scaled_ui
        continue-on-error: true
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR = "2"
          $env:QT_QPA_PLATFORM = "windows"
          try {
            ./.venv-build/Scripts/python.exe -m pytest tests/test_zoom_stability.py tests/test_native_corners.py tests/test_chrome.py tests/test_footer_localization_layout.py tests/test_i18n.py tests/test_i18n_dialogs.py tests/test_settings_redesign.py tests/test_menu_widgets.py tests/test_startup_display.py tests/test_histogram.py tests/test_details_overlay.py tests/test_glass_backdrop.py -q
            if ($LASTEXITCODE -ne 0) { throw "High-DPI regression tests failed" }
          } finally {
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          }
      - name: Verify loaded-image drop regression sensitivity
        id: drop_regression
        continue-on-error: true
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/check_drop_regression.py
      - name: Capture localized native Qt controls
        id: ui_capture
        continue-on-error: true
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          try {
            foreach ($language in @("en", "zh-CN", "zh-TW")) {
              ./.venv-build/Scripts/python.exe -m scripts.render_ui_preview --language $language --output "build/ui-evidence/$language"
              if ($LASTEXITCODE -ne 0) { throw "Localized UI capture failed: $language" }
              ./.venv-build/Scripts/python.exe -m scripts.render_menu_preview --language $language --output "build/ui-evidence/$language/menus" --no-animation
              if ($LASTEXITCODE -ne 0) { throw "Localized popup capture failed: $language" }
              ./.venv-build/Scripts/python.exe -m scripts.render_details_preview --language $language --output "build/ui-evidence/$language/details"
              if ($LASTEXITCODE -ne 0) { throw "Localized Details capture failed: $language" }
            }
            $env:QT_SCALE_FACTOR = "2"
            ./.venv-build/Scripts/python.exe -m scripts.render_ui_preview --language zh-CN --output build/ui-evidence/zh-CN-200 --width 800
            if ($LASTEXITCODE -ne 0) { throw "Scaled UI capture failed" }
          } finally {
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          }
      - name: Smoke real bundled UI and decoders
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/smoke_bundle.py dist/Luma/Luma.exe
      - name: Exercise real isolated Shell thumbnail surrogate
        id: thumbnails
        continue-on-error: true
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/smoke_thumbnails.py
      - name: Collect dependency sources
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/prepare_source_material.py --version 0.1.3
      - name: Package candidate ZIP and checksums
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/package_release.py --version 0.1.3
      - name: Build current-user Windows installer
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - name: Verify native installer layout and language controls
        id: installer_ui
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/build_installer.ps1 -UiFontScaleTest -OutputDir build/installer-font-test
          if ($LASTEXITCODE -ne 0) { throw "Installer font-metric stress build failed" }
          ./.venv-build/Scripts/python.exe scripts/smoke_installer_ui.py --installer artifacts/Luma-0.1.3-windows-x64-setup.exe --scaled-installer build/installer-font-test/Luma-0.1.3-windows-x64-ui-font-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native installer UI verification failed" }
      - name: Verify installer lifecycle on disposable runner
        shell: pwsh
        run: ./scripts/test_installer.ps1 -Installer artifacts/Luma-0.1.3-windows-x64-setup.exe
      - name: Require successful Shell and UI validation before accepting candidate
        if: steps.thumbnails.outcome != 'success' || steps.scaled_ui.outcome != 'success' || steps.ui_capture.outcome != 'success' || steps.installer_ui.outcome != 'success' || steps.drop_regression.outcome != 'success'
        shell: pwsh
        run: throw 'Required Shell or UI validation failed; candidate artifacts are withheld.'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: luma-0.1.3-windows-candidate
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: luma-thumbnail-diagnostics
          path: |
            build/*report*.json
            build/installer-smoke/**
            build/installer-ui/**
            build/installer-preflight/**
            build/ui-evidence/**
            build/thumbnail-artifacts/**
            build/thumbnail/Testing/Temporary/*
            build/Luma/warn-Luma.txt
            dist/Luma/bundle-inventory.txt
          if-no-files-found: ignore
          retention-days: 14
