name: Windows thumbnail and installer validation

on:
  push:
    branches: [feature/explorer-thumbnails]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-thumbnail-validation
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      LUMA_SHELL_TEST_REAL_REGISTRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build native bridge, test viewer, create folder bundle
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify installer and release-safety contracts
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe -m pytest scripts/test_installer_contract.py scripts/test_release_gate.py -q
      - name: Verify loaded-image drop regression sensitivity
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/check_drop_regression.py
      - name: Smoke real bundled UI and decoders
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/smoke_bundle.py dist/Luma/Luma.exe
      - name: Exercise real isolated Shell thumbnail surrogate
        id: thumbnails
        continue-on-error: true
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/smoke_thumbnails.py
      - name: Collect dependency sources
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/prepare_source_material.py --version 0.1.1
      - name: Package candidate ZIP and checksums
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe scripts/package_release.py --version 0.1.1
      - name: Build current-user Windows installer
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - name: Verify installer lifecycle on disposable runner
        shell: pwsh
        run: ./scripts/test_installer.ps1 -Installer artifacts/Luma-0.1.1-windows-x64-setup.exe
      - name: Require successful Shell isolation before accepting candidate
        if: steps.thumbnails.outcome != 'success'
        shell: pwsh
        run: throw 'Required Shell thumbnail validation failed; candidate artifacts are withheld.'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: luma-0.1.1-windows-candidate
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: luma-thumbnail-diagnostics
          path: |
            build/*report*.json
            build/installer-smoke/**
            build/thumbnail-artifacts/**
            build/thumbnail/Testing/Temporary/*
            build/Luma/warn-Luma.txt
            dist/Luma/bundle-inventory.txt
          if-no-files-found: ignore
          retention-days: 14
